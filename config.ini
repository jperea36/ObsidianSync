[paths]
local = C:\path\to\Obsidian
icloud = C:\path\to\iCloud

[logging]
log_file = sync.log
level = INFO

[sync]
debounce_seconds = 30
; How often to check iCloud for changes made on other devices (seconds)
reconcile_interval = 300
; Wait after startup / waking from sleep so iCloud can catch up (seconds)
startup_delay = 60
; Overwritten conflicts and deleted files are moved here (inside each folder)
archive_folder = .sync-archive
; Remembers what was in sync last time, so deletions can be detected
state_file = sync_state.json

[ignore]
patterns =
    ~$*
    *.tmp
    .DS_Store
    desktop.ini
    workspace*.json
